<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Your Rooms land/property owner account request has been received.">
    <title>Account request received | Rooms</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #153d4c; background: #f7f9f9; --teal: #17607a; --navy: #153d4c; --muted: #64777b; --line: #dfe8e9; --yellow: #ffc629; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      a { color: inherit; text-decoration: none; }
      .topbar { background: var(--navy); color: white; }
      .nav { display: flex; width: min(1160px, calc(100% - 40px)); min-height: 74px; align-items: center; margin: 0 auto; }
      .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
      .brand-mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 11px; background: var(--yellow); color: #082a55; }
      .brand-mark svg { width: 27px; height: 27px; }
      .brand-dot { color: #e53950; }
      main { width: min(620px, calc(100% - 32px)); margin: 48px auto 56px; }
      .card { padding: clamp(24px, 5vw, 42px); border: 1px solid var(--line); border-radius: 20px; background: white; text-align: center; box-shadow: 0 14px 40px #153d4c0a; }
      .check { display: grid; width: 58px; height: 58px; place-items: center; margin: 0 auto 18px; border-radius: 50%; background: #e8f5ed; color: #267348; font-size: 30px; font-weight: 800; }
      .eyebrow { margin: 0 0 10px; color: var(--teal); font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
      h1 { margin: 0; color: var(--navy); font-size: clamp(29px, 5vw, 38px); line-height: 1.12; letter-spacing: -1px; }
      .intro { max-width: 450px; margin: 12px auto 22px; color: var(--muted); font-size: 15px; line-height: 1.55; }
      .next-step { padding: 15px; border-radius: 12px; background: #f0f6f6; color: #435f65; font-size: 13px; line-height: 1.55; text-align: left; }
      .next-step strong { color: var(--navy); }
      .button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; margin-top: 22px; padding: 11px 17px; border-radius: 11px; background: var(--yellow); color: var(--navy); font-weight: 750; }
      @media (max-width: 580px) {
        .nav { width: calc(100% - 28px); min-height: 64px; }
        .brand { gap: 8px; font-size: 24px; }
        .brand-mark { width: 35px; height: 35px; border-radius: 9px; }
        .brand-mark svg { width: 24px; height: 24px; }
        main { margin-top: 24px; }
        .button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="{% url 'home' %}" aria-label="Rooms home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 11 9-8 9 8"></path><path d="M5.5 10v10h13V10"></path><path d="M9 20v-6h6v6"></path>
            </svg>
          </span>
          <span>Rooms<span class="brand-dot">.</span></span>
        </a>
      </nav>
    </header>
    <main>
      <section class="card">
        <div class="check" aria-hidden="true">✓</div>
        <p class="eyebrow">Land and property listings</p>
        <h1>Account request received</h1>
        <p class="intro">Your owner account request is now with the Rooms team for review. You can sign in after Haidware approves your account.</p>
        <p class="next-step"><strong>Next step:</strong> Once approved, sign in to submit and manage your land or property listing.</p>
        <a class="button" href="{% url 'home' %}">Return to homes</a>
      </section>
    </main>
  </body>
</html>
